name: Update FX data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fx-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch and validate feeds
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://fx-feed.ureimerurirar-iegoh.workers.dev"
          mkdir -p data .tmp

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$base_url/usdjpy" -o .tmp/usdjpy.json

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$base_url/eurusd" -o .tmp/eurusd.json

          jq -e '
            .symbol == "USD/JPY" and
            (.fetched_at | type == "string") and
            (.current_price | tonumber > 0) and
            (.candles | type == "object")
          ' .tmp/usdjpy.json >/dev/null

          jq -e '
            .symbol == "EUR/USD" and
            (.fetched_at | type == "string") and
            (.current_price | tonumber > 0) and
            (.candles | type == "object")
          ' .tmp/eurusd.json >/dev/null

          jq --sort-keys . .tmp/usdjpy.json > data/usdjpy.json
          jq --sort-keys . .tmp/eurusd.json > data/eurusd.json
          jq -n --sort-keys \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile usdjpy data/usdjpy.json \
            --slurpfile eurusd data/eurusd.json \
            '{generated_at: $generated_at, usdjpy: $usdjpy[0], eurusd: $eurusd[0]}' \
            > fx-data.json

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy.json data/eurusd.json fx-data.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update FX data"
          git push
